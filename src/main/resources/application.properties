spring.application.name=cafeOn

# ===============================
# Application Logging Level
# = ===============================

# 1. 개발/디버깅 환경
 logging.level.com.b1a4.cafeOn=DEBUG
# JwtAuthenticationFilter의 DEBUG 로그 출력

# 2. 운영/프로덕션 환경
#logging.level.com.b1a4.cafeOn=INFO
# JwtAuthenticationFilter의 DEBUG 로그 무시

# ===============================
# Database Connection Settings
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# S3 Connection Settings
# ===============================
cafeon.cdn-base-url=${CDN_BASE_URL:https://cafeon-b1a4.s3.amazonaws.com/}
spring.cloud.aws.region.static=${AWS_REGION}
spring.cloud.aws.s3.bucket=${AWS_S3_BUCKET}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}


# ===============================
# JPA / Hibernate SQL 로그 + 파라미터 출력
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.orm.jdbc.bind=off

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always


# ===============================
# JWT
# ===============================
# 이슈 발급자
jwt.issuer=team_b1a4-cafeOnProject
# 비밀키
jwt.secret_key=${JWT_SECRET_KEY}


# ===============================
# Swagger UI / OpenAPI 설정
# ===============================
# Swagger UI 접속 경로 (기본: /swagger-ui/index.html)
springdoc.swagger-ui.path=/api-docs

# OpenAPI JSON 문서 경로 (기본: /v3/api-docs)
#springdoc.api-docs.path=/api-docs-json

# 문서 기본 정보
springdoc.swagger-ui.operationsSorter=method
# 메서드(GET/POST 등) 기준 정렬
springdoc.swagger-ui.tagsSorter=alpha
# 태그 알파벳순 정렬

# API info (제목, 설명, 버전)
springdoc.api-docs.version=openapi-3.0
springdoc.show-actuator=true

# ===============================
# Mail Settings (임시 비밀번호 발송용)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# TLS 방식(보안 연결)에서 사용하는 포트 번호. Gmail에서는 587이 일반적
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Spring Boot 로그 컬러 활성화
spring.output.ansi.enabled=always

# Kakao API key
kakao.api.key=${KAKAO_API_KEY}

# 최대 파일 크기 제한 설정 (개별 파일)
spring.servlet.multipart.max-file-size=10MB

# 전체 요청 크기 제한 설정
spring.servlet.multipart.max-request-size=10MB
